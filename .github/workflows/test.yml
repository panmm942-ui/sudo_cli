name: Native terminal CLI verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.platform }} / ${{ matrix.arch }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Explicit supported labels, checked against GitHub's runner reference:
        # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
        include:
          - os: ubuntu-24.04
            platform: Linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: Linux
            arch: arm64
          - os: windows-2025
            platform: Windows
            arch: x64
          - os: windows-11-arm
            platform: Windows
            arch: arm64
          - os: macos-15-intel
            platform: macOS
            arch: x64
          - os: macos-15
            platform: macOS
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - name: Confirm native architecture
        run: node -e "if (process.arch !== '${{ matrix.arch }}') throw new Error('Unexpected runner architecture'); console.log(process.platform, process.arch, process.version)"
      - name: Install the pinned project-local native engine
        run: node scripts/setup-runtime.mjs
      - name: Verify native engine startup without a model call
        run: node bin/sudocli.mjs doctor
      - name: Prove pinned Linux sandbox enforcement and admit only trusted user namespaces if required
        if: runner.os == 'Linux'
        run: sudo -E "$(command -v node)" scripts/ci/linux-native-preflight.mjs
      - name: Test Windows admission, real engine and local fixtures
        if: runner.os == 'Windows'
        run: node --test --test-concurrency=4 --test-timeout=120000
      - name: Test Unix root admission, real engine and local fixtures
        if: runner.os != 'Windows'
        run: sudo -E "$(command -v node)" --test --test-concurrency=4 --test-timeout=120000
      - name: Exercise broad native Linux terminal regression
        if: runner.os == 'Linux'
        run: sudo -E python3 -B test/manual/verify-v0.6-linux.py --node "$(command -v node)" --output-directory "${{ runner.temp }}/v0.6.1-regression-proof"
      - name: Exercise native Linux local AI and agent acceptance
        if: runner.os == 'Linux'
        run: sudo -E python3 -B test/manual/verify-v0.6.1-linux.py --node "$(command -v node)" --output-directory "${{ runner.temp }}/v0.6.1-terminal-proof"
      - name: Exercise live slash picker and local model file inspection
        if: runner.os == 'Linux'
        run: sudo -E python3 -B test/manual/verify-v0.6.2-linux.py --node "$(command -v node)" --output-directory "${{ runner.temp }}/v0.6.2-terminal-proof"
      - name: Exercise terminal colors, local activity and notification settings
        if: runner.os == 'Linux'
        run: sudo -E python3 -B test/manual/verify-v0.6.7-ui-linux.py --with-native-ai --node "$(command -v node)" --output-directory "${{ runner.temp }}/v0.6.7-ui-proof"
      - name: Exercise custom model tools, interruption, timeouts and repetition protection
        if: runner.os == 'Linux'
        run: sudo -E python3 -B test/manual/verify-v0.6.3-model-loop-linux.py --node "$(command -v node)" --output-directory "${{ runner.temp }}/v0.6.3-model-proof"
      - name: Remove the CI-specific Linux user namespace allowance
        if: always() && runner.os == 'Linux'
        run: sudo -E "$(command -v node)" scripts/ci/linux-native-preflight.mjs --cleanup
